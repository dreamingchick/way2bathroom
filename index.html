<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>챠챠, 씻으러 가자!</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eee6da;color:#42352d;font:16px system-ui,sans-serif}main{max-width:540px;margin:auto;padding:24px 18px}header{display:flex;justify-content:space-between;align-items:center}small,.sub{color:#7d7064}h1{font-size:28px;margin:8px 0}#clock{font-size:32px;font-variant-numeric:tabular-nums}#map{display:flex;gap:5px;margin:20px 0}#map span{flex:1;text-align:center;font-size:12px;padding:9px 0;border-radius:10px;background:#ddd2c1}#map .here{background:#688574;color:white}.scene{height:245px;position:relative;border:5px solid #fff9ef;border-radius:24px;overflow:hidden;background:linear-gradient(#e8d9bd 65%,#bba082 65%);box-shadow:0 10px 30px #614e3117} .window{position:absolute;top:24px;left:30px;background:#d9e7df;border:7px solid #fff8ec;width:80px;height:85px}.door{position:absolute;right:25px;top:35px;height:165px;width:76px;background:#77988b;border:8px solid #fff3dd;border-bottom:0}.door:after{content:'浴';position:absolute;top:35px;left:16px;color:#eef3e8;font-size:24px}.dog{position:absolute;bottom:18px;left:36%;font-size:90px;filter:drop-shadow(0 9px 3px #59483033);transition:transform .4s} .busy .dog{animation:wiggle .7s infinite alternate}@keyframes wiggle{to{transform:translateX(9px) rotate(-7deg)}}#ant{display:none;position:absolute;bottom:18px;font-size:24px;animation:crawl 3s linear infinite}@keyframes crawl{from{left:10%}to{left:85%}}#bubble{position:absolute;top:14px;right:10px;max-width:240px;background:white;padding:10px 14px;border-radius:16px;font-size:14px}.card{background:#fffaf1;padding:18px;border-radius:18px;margin:16px 0}#event{font-size:20px;margin:0 0 8px}#choices{display:grid;gap:10px}button{font:inherit;border:0;border-radius:14px;padding:16px;cursor:pointer;background:#fffaf1;color:#42352d;text-align:left;box-shadow:0 2px 0 #d9cbb8}button:disabled{opacity:.5;cursor:default}.primary{background:#547c68;color:white;text-align:center;width:100%}#log{font-size:13px;line-height:1.8;color:#736458;padding-left:20px}footer{margin-top:24px;font-size:12px;color:#897b6b}dialog{border:0;border-radius:22px;padding:26px;max-width:90%;background:#fffaf1;color:#42352d}dialog::backdrop{background:#302a2477}
</style>
<main><header><small>WAY 2 BATHROOM · v0.1</small><span id="clock">00:00.00</span></header>
<h1>챠챠, 씻으러 가자!</h1><div class="sub">욕실은 가까운데, 마음은 아직 방석 위.</div>
<nav id="map" aria-label="이동 경로"></nav>
<div class="scene" id="scene"><div class="window"></div><div class="door"></div><div class="dog" aria-label="차우차우 챠챠">🐕</div><div id="ant">🐜</div><div id="bubble">목욕… 지금 해야 해?</div></div>
<div class="card"><strong id="mood"></strong><p id="event">오늘의 짧고도 긴 여정</p><div id="desc">표정과 기분을 살피며 선택해 주세요. 개미가 나타나면 챠챠가 스스로 반응합니다.</div></div>
<div id="choices"><button class="primary" id="start">챠챠 부르기 · 시작</button></div>
<ol id="log" aria-live="polite"></ol><footer>개인 기록은 이 기기에 저장됩니다. 공유 랭킹은 준비 중입니다.<br><span id="best"></span></footer></main>
<dialog id="result"><h2>드디어, 욕실 도착!</h2><p id="record"></p><p id="summary"></p><button class="primary" id="again">한 번 더 데려가기</button></dialog>
<script type="module">
import { createState, choose, antEvent, moodNames, places } from './engine.js';
let s, active=false, busy=false, start=0, token=0, timer;
const $=id=>document.getElementById(id);
const format=ms=>{const n=Math.floor(ms/10);return String(Math.floor(n/6000)).padStart(2,'0')+':'+String(Math.floor(n/100)%60).padStart(2,'0')+'.'+String(n%100).padStart(2,'0')};
function best(){try{$('best').textContent='최고 기록: '+(localStorage.getItem('chacha-best')?format(+localStorage.getItem('chacha-best')):'아직 없어요')}catch{$('best').textContent='기록 저장을 사용할 수 없습니다.'}}
function draw(){ $('map').innerHTML=places.map((p,i)=>'<span class="'+(s&&s.pos===i?'here':'')+'">'+p+'</span>').join('');$('mood').textContent=s?'기분 · '+moodNames[s.mood]+' / 신뢰 '+s.trust:''; }
const situations=[
['방석과의 이별','챠챠가 방석 끝을 앞발로 꼭 누르고 있습니다.'],
['방문 앞의 망설임','문턱 너머를 보지만 몸은 움직이지 않습니다.'],
['거실의 유혹','익숙한 냄새와 장난감이 챠챠를 부릅니다.'],
['따뜻한 햇볕','햇볕 아래에 누우면 딱 좋을 것 같습니다.'],
['마지막 문턱','낯선 타일을 보고 앞발을 살짝 거둡니다.']];
function prompt(){if(!active)return;draw();const [title,desc]=situations[s.pos];$('event').textContent=title;$('desc').textContent=desc;$('choices').replaceChildren();['차분하게 이름 부르기','간식으로 유도하기','장난감으로 관심 끌기'].forEach((label,i)=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>act(i);$('choices').append(b)})}
function note(t){const li=document.createElement('li');li.textContent=t;$('log').prepend(li);while($('log').children.length>5)$('log').lastChild.remove()}
async function show(r,my){busy=true;$('scene').classList.add('busy');$('choices').replaceChildren();$('bubble').textContent=r.line;$('event').textContent=r.title;$('desc').textContent=r.text;note(r.title+' — '+r.line);await new Promise(resolve=>setTimeout(resolve,r.seconds*1000));if(my!==token)return false;$('scene').classList.remove('busy');busy=false;draw();return true}
async function act(i){if(!active||busy)return;busy=true;const my=token;const r=choose(s,i);if(!await show(r,my))return;if(s.pos===5){finish();return}if(s.turn-s.lastAnt>=3&&s.ants<2&&s.pos>0&&Math.random()<.15){$('ant').style.display='block';const a=antEvent(s);if(!await show(a,my))return;$('ant').style.display='none'}prompt()}
function finish(){active=false;clearInterval(timer);const elapsed=Date.now()-start;$('clock').textContent=format(elapsed);try{const old=+localStorage.getItem('chacha-best');if(!old||elapsed<old)localStorage.setItem('chacha-best',String(elapsed))}catch{}best();$('record').textContent='도착 기록 '+format(elapsed);$('summary').textContent='설득 '+s.turn+'회 · 개미와 만남 '+s.ants+'회. “들어왔으니까… 칭찬부터 해 줘.”';$('result').showModal()}
function begin(){token++;s=createState();active=true;busy=false;start=Date.now();$('log').replaceChildren();$('ant').style.display='none';$('bubble').textContent='일단… 따라가 볼까?';clearInterval(timer);timer=setInterval(()=>{$('clock').textContent=format(Date.now()-start)},30);prompt()}
$('start').onclick=begin;$('again').onclick=()=>{$('result').close();begin()};$('result').addEventListener('cancel',e=>e.preventDefault());draw();best();
</script></html>
